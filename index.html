const D=[["Saat mengumpan jarak pendek pada permainan sepak bola, seorang pemain mengayunkan kaki dengan bidang sentuh bagian dalam kaki. Teknik yang ditunjukkan adalah ...", ["tendangan punggung kaki", "sundulan terarah", "kontrol menggunakan paha", "lemparan ke dalam", "operan kaki bagian dalam"], "Permainan sepak bola"], ["Dalam serangan dua lawan satu, pembawa bola dihadang bek sedangkan rekannya bergerak bebas menuju gawang. Keputusan terbaik adalah ...", ["menahan bola sampai dua bek mendekat", "menendang ke luar lapangan", "mengoper ke rekan pada saat jalur operan terbuka", "berbalik menjauhi gawang meskipun jalur terbuka", "menggiring tepat ke arah bek tanpa melihat rekan"], "Permainan sepak bola"], ["Ilustrasi analisis taktik Piala Dunia FIFA. Dalam serangan sepak bola, penyerang sayap masuk ke tengah sehingga dua pemain berkumpul dekat bek tengah. Bek lawan mengikuti keduanya dan tembakan diblok. Penyebab utama kegagalan memanfaatkan ruang adalah ...", ["pergerakan penyerang mempersempit jarak antarpemain di area yang sama", "penjaga gawang lawan berdiri di tengah", "bola dimainkan di wilayah serang", "bek lawan menggunakan sepatu yang sama", "pertandingan berlangsung pada babak kedua"], "Permainan sepak bola"], ["Data berikut merupakan simulasi pertandingan ASEAN Cup. Catatan dua pola serangan menunjukkan: pola A, 12 serangan, 6 tembakan tepat sasaran, 2 gol; pola B, 12 serangan, 3 tembakan tepat sasaran, 1 gol. Jika tujuan meningkatkan peluang mencetak gol, keputusan paling didukung data adalah ...", ["memilih B karena jumlah serangan sama", "memilih B karena jumlah tembakan tepat sasaran lebih sedikit", "menolak keduanya karena penguasaan bola tidak dicatat", "memprioritaskan pola A karena lebih banyak tembakan tepat sasaran dan gol", "menganggap kedua pola sama efektif karena dilakukan 12 kali"], "Permainan sepak bola"], ["Pada sepak bola, lawan mendapat tendangan bebas tidak langsung di dekat gawang. Sebelum gol dinyatakan sah, bola harus ...", ["langsung masuk gawang tanpa sentuhan lain", "menyentuh pemain lain setelah ditendang", "keluar melewati garis samping", "dipantulkan ke tangan penjaga gawang", "ditendang dari titik penalti"], "Permainan sepak bola"], ["Dua siswa mencoba mengontrol umpan mendatar. Siswa A menegangkan kaki sehingga bola memantul jauh; siswa B menarik kaki sedikit saat menyentuh bola sehingga bola dekat dengannya. Analisis paling tepat adalah ...", ["kaki yang kaku selalu membuat kontrol lebih akurat", "arah bola hanya bergantung pada warna sepatu", "kontrol yang baik mengharuskan bola memantul sejauh mungkin", "posisi kaki tidak memengaruhi hasil kontrol", "gerak menarik kaki mengurangi pantulan karena membantu meredam laju bola"], "Permainan sepak bola"], ["Data berikut merupakan simulasi pertandingan kompetisi FIFA. Dalam latihan sepak bola, tercatat 36 operan tepat dari 45 percobaan. Persentase operan tepat adalah ...", ["75%", "85%", "80%", "90%", "70%"], "Permainan sepak bola"], ["Tim tertinggal satu gol dengan lima menit tersisa. Tersedia satu penyerang cepat, satu pengumpan akurat, dan dua pemain sayap; lawan menumpuk pemain di tengah. Rancangan serangan paling sesuai adalah ...", ["mengalirkan bola ke sayap lalu memberi umpan terukur kepada penyerang di ruang kosong", "menempatkan semua pemain menyerang di tengah secara rapat", "melarang pemain sayap ikut membangun serangan", "mempertahankan bola terus di area pertahanan sendiri", "mengandalkan tembakan jarak jauh dari setiap penguasaan bola"], "Permainan sepak bola"], ["Dalam laporan simulasi pertandingan FIFA ASEAN Cup, tiga gol tercipta setelah bek mengoper ke gelandang, gelandang mengalihkan bola ke sayap, dan penyerang menyelesaikan umpan silang. Peran kerja sama antarpemain yang paling tepat ditunjukkan oleh ...", ["rangkaian operan antarlini yang menciptakan ruang sebelum penyelesaian akhir", "kemampuan penyerang menyelesaikan peluang tanpa dukungan pemain lain", "upaya setiap pemain menggiring bola langsung dari daerah pertahanan", "penempatan seluruh pemain pada satu jalur umpan di tengah lapangan", "pengurangan pergerakan pemain tanpa bola agar pertahanan tetap rapat"], "Permainan sepak bola"], ["Pada ilustrasi pertandingan Piala Dunia FIFA, wasit menghentikan permainan karena pelanggaran. Kapten meminta penjelasan dengan tenang, sedangkan seorang pemain lain memprotes dengan mendorong lawan. Dampak perilaku yang paling tepat dianalisis adalah ...", ["protes fisik membantu wasit mengevaluasi keputusan dengan lebih cepat", "kapten dan pemain lain sama-sama menunjukkan pengendalian emosi", "sikap kapten menjaga komunikasi, sedangkan dorongan berisiko menambah sanksi dan konflik", "setiap keputusan wasit dapat diubah melalui dorongan terhadap lawan", "kedua respons tidak berpengaruh terhadap keselamatan pertandingan"], "Permainan sepak bola"], ["Ketika menerima bola voli setinggi pinggang dengan kedua lengan dirapatkan dan diluruskan, pemain melakukan ...", ["passing atas", "smash", "blok tunggal", "passing bawah", "servis atas"], "Permainan bola voli"], ["Bola servis lawan datang cepat dan rendah menuju depan tubuh penerima. Tindakan teknik yang paling tepat ialah ...", ["memukul bola dengan satu tangan di atas kepala", "merendahkan posisi tubuh dan mengarahkan bola dengan passing bawah", "melompat untuk melakukan smash", "membiarkan bola menyentuh lantai lebih dahulu", "menangkap bola sebelum diarahkan kepada pengumpan"], "Permainan bola voli"], ["Ilustrasi pertandingan bola voli SEA Games 2025. Dalam satu set bola voli, enam servis beruntun lawan diarahkan ke celah antara pemain posisi 5 dan 6; empat bola tidak terjangkau karena keduanya saling menunggu. Masalah utama adalah ...", ["tinggi net terlalu rendah", "servis selalu dinyatakan salah", "jumlah pemain di lapangan terlalu banyak", "tim lawan tidak memiliki pengumpan", "pembagian tanggung jawab penerimaan pada area perbatasan kurang jelas"], "Permainan bola voli"], ["Dalam sistem rotasi bola voli, tim penerima memperoleh hak servis setelah memenangkan reli. Para pemain kemudian ...", ["berotasi satu posisi berlawanan arah jarum jam", "bertukar posisi bebas tanpa urutan", "berotasi satu posisi searah jarum jam sebelum servis", "seluruhnya berpindah ke barisan depan", "tetap pada posisi rotasi semula sepanjang pertandingan"], "Permainan bola voli"], ["Data berikut merupakan simulasi pertandingan liga voli nasional. Pada latihan servis voli, pemain A mencatat 18 servis masuk, 2 gagal, dan 4 ace dari 20 percobaan; B mencatat 15 servis masuk, 5 gagal, dan 5 ace. Saat skor kritis dan prioritasnya menghindari kehilangan poin karena kesalahan servis, pilihan paling tepat adalah ...", ["memilih A karena tingkat servis masuknya lebih tinggi", "memilih B semata-mata karena jumlah ace lebih tinggi", "memilih B karena kesalahan servisnya lebih banyak", "memilih A karena ia melakukan lebih sedikit percobaan", "menganggap tidak ada perbedaan data kedua pemain"], "Permainan bola voli"], ["Tiga kali bola voli diumpan terlalu dekat dengan net ketika smasher mulai bergerak; dua serangan menyentuh net. Perbaikan paling langsung adalah ...", ["meminta smasher memukul sebelum bola mencapai net", "menghilangkan komunikasi pengumpan dengan smasher", "menempatkan pengumpan di luar lapangan", "menyelaraskan waktu awalan smasher dengan tinggi dan posisi umpan", "mengubah skor pertandingan sebelum servis"], "Permainan bola voli"], ["Skor set bola voli adalah 24–24. Tim A menang reli berikutnya sehingga 25–24. Agar memenangkan set biasa hingga 25 poin, tim A harus ...", ["langsung dinyatakan menang pada 25–24", "memenangkan satu reli lagi agar unggul dua poin", "menunggu hingga kedua tim mencapai 30", "memenangkan tiga reli tanpa memedulikan skor", "meminta set diulang dari skor 0–0"], "Permainan bola voli"], ["Sebuah tim voli memiliki dua penerima servis andal, satu pengumpan dan tiga penyerang. Lawan sering mengarahkan servis ke pemain yang lemah menerima bola. Penataan awal paling tepat adalah ...", ["menumpuk seluruh pemain di dekat net", "memindahkan pengumpan keluar lapangan saat menerima servis", "mengabaikan area tempat lawan sering melakukan servis", "menempatkan semua penyerang pada satu titik yang sama", "menempatkan penerima andal untuk menutup area rawan sesuai rotasi sah dan tetap memberi jalur kepada pengumpan"], "Permainan bola voli"], ["Data simulasi pertandingan liga voli nasional menunjukkan: laga I menghasilkan 8 poin ace dan 12 kesalahan servis; laga II menghasilkan 11 poin ace dan 5 kesalahan servis, dengan total servis masing-masing 40. Analisis yang paling didukung data adalah ...", ["laga I lebih efektif karena jumlah kesalahan servis lebih banyak", "laga II meningkatkan ace sekaligus menurunkan kesalahan servis", "jumlah ace kedua laga sama bila dibagi total servis", "laga II pasti menang pertandingan karena angka ace lebih tinggi", "laga I memiliki risiko servis lebih rendah daripada laga II"], "Permainan bola voli"], ["Pemain basket mendorong bola dari depan dada dengan kedua tangan ke arah teman sejajar dada. Jenis operan tersebut adalah ...", ["bounce pass", "overhead pass", "chest pass", "baseball pass", "behind-the-back pass"], "Permainan bola basket"], ["Seorang pemain basket dijaga ketat dengan kedua tangan lawan menghalangi jalur operan lurus setinggi dada, tetapi ruang dekat lantai terbuka. Jenis operan yang relatif lebih tepat ialah ...", ["bounce pass melalui lantai", "chest pass lurus tepat ke tangan penjaga", "lemparan tanpa melihat arah rekan", "tembakan dari tengah lapangan", "operan tinggi ke tribun"], "Permainan bola basket"], ["Ilustrasi pertandingan liga bola basket internasional. Pada fast break basket tiga penyerang melawan dua pemain bertahan, pembawa bola memaksa lay-up saat dua bek menutup jalurnya; dua rekannya bebas di sayap. Peluang gagal terutama karena ...", ["tim menyerang memiliki terlalu banyak pilihan", "dua pemain bertahan tidak boleh berada di area kunci", "semua fast break harus diakhiri tembakan tiga angka", "pembawa bola tidak memanfaatkan keunggulan jumlah melalui operan", "rekan di sayap dilarang menerima operan"], "Permainan bola basket"], ["Setelah berhenti menggiring bola basket dan memegang bola dengan kedua tangan, pemain kembali menggiring. Pelanggarannya disebut ...", ["traveling", "double dribble", "goaltending", "backcourt violation", "personal foul"], "Permainan bola basket"], ["Data berikut merupakan simulasi pertandingan liga basket nasional. Tim basket memasukkan 14 tembakan dua angka dan 6 tembakan tiga angka, tanpa lemparan bebas. Total poin adalah ...", ["40 poin", "42 poin", "48 poin", "52 poin", "46 poin"], "Permainan bola basket"], ["Data berikut merupakan simulasi pertandingan basket Asian Games 2026. Dalam dua kuarter basket, tim A mencatat 18 rebound dan 4 turnover, sedangkan B 10 rebound dan 12 turnover. Akurasi tembakan kedua tim serupa, tetapi A unggul skor. Faktor yang paling masuk akal menjelaskan keunggulan A ialah ...", ["B pasti memperoleh lebih banyak tembakan dari rebound", "jumlah turnover tidak berhubungan dengan kesempatan menyerang", "A memperoleh lebih banyak kesempatan penguasaan bola dan lebih sedikit kehilangan bola", "A unggul karena menggunakan seragam berbeda", "akurasi tembakan A pasti dua kali lipat B"], "Permainan bola basket"], ["Siswa yang melakukan lay-up kanan terus menumpu dengan kaki kanan setelah dua langkahnya, sehingga tembakan tidak seimbang. Perbaikan ritme yang paling sesuai adalah ...", ["mengatur langkah kanan lalu kiri dan bertolak dengan kaki kiri", "mengawali setiap lay-up dengan melompat dua kaki secara bersamaan", "menumpu kaki kanan untuk semua lay-up kanan", "menutup mata selama langkah terakhir", "menggiring lagi setelah memegang bola dengan kedua tangan"], "Permainan bola basket"], ["Sisa pertandingan basket 30 detik. Lawan unggul dua poin dan penembak tiga angka terbaiknya berada di sisi kanan, sementara tim sendiri telah melakukan banyak foul. Rancangan bertahan paling bijak adalah ...", ["membiarkan penembak utama tanpa penjagaan", "melakukan pelanggaran pada setiap pemain yang menyentuh bola", "mengumpulkan lima pemain tepat di bawah ring tanpa memperhatikan tembakan luar", "menugaskan penjaga rapat pada penembak utama, membantu di jalur penetrasi, dan menghindari kontak yang tidak perlu", "menjaga hanya pemain lawan yang sedang tidak memegang bola"], "Permainan bola basket"], ["Grafik simulasi akurasi tembakan dua pertandingan liga basket internasional menunjukkan pertandingan I: 18 tembakan masuk dari 45 percobaan; pertandingan II: 24 masuk dari 48 percobaan. Pernyataan yang paling tepat adalah ...", ["akurasi pertandingan I 45% dan pertandingan II 48%", "akurasi pertandingan II lebih rendah karena percobaannya lebih banyak", "jumlah tembakan masuk saja tidak dapat dibandingkan dengan percobaan", "akurasi meningkat dari 40% menjadi 50% pada pertandingan II", "akurasi tidak berubah karena kedua pertandingan melibatkan tim yang sama"], "Permainan bola basket"], ["Dalam bulu tangkis, pukulan dari area belakang diarahkan tinggi dan jauh ke bagian belakang lapangan lawan. Pukulan itu disebut ...", ["netting tipis", "clear atau lob", "drive datar", "drop shot pendek", "smash menukik"], "Bulu tangkis"], ["Dalam permainan tunggal bulu tangkis, lawan sudah berada sangat dekat net ketika kok datang kepada Anda di belakang lapangan. Pukulan yang dapat memanfaatkan ruang kosong adalah ...", ["netting pendek tepat ke posisi lawan", "pukulan pelan ke tengah dekat net", "smash langsung ke raket lawan", "mengembalikan kok ke area yang sedang ditutup lawan", "clear jauh ke garis belakang lawan"], "Bulu tangkis"], ["Ilustrasi reli kejuaraan bulu tangkis internasional. Dalam reli bulu tangkis, pemain A dua kali memberi clear ke belakang lalu tiba-tiba melakukan drop shot, sedangkan lawan masih bergerak mundur. Mengapa variasi ini berpotensi efektif?", ["drop shot selalu memberi poin tanpa memperhatikan posisi lawan", "clear membuat lawan otomatis kehilangan poin", "perubahan arah dan tempo memaksa lawan berbalik menuju ruang depan yang kosong", "lawan dilarang bergerak setelah menerima dua clear", "drop shot hanya bisa dilakukan saat servis"], "Bulu tangkis"], ["Pada tunggal bulu tangkis, server memiliki skor 8 (genap). Dari bidang servis mana ia melakukan servis?", ["kanan", "kiri", "tengah lapangan", "bagian luar garis samping", "bebas dari sisi mana pun"], "Bulu tangkis"], ["Data berikut merupakan simulasi pertandingan bulu tangkis SEA Games 2025. Pada gim pertama bulu tangkis, pemain A kalah dengan 11 kesalahan sendiri dan sering kehilangan poin saat menyerang garis samping. Pada gim kedua, ia mengurangi kesalahan menjadi 4 dan reli bertahan lebih lama. Perubahan taktik paling tepat untuk dipertahankan adalah ...", ["memaksakan semua pukulan mengarah tepat garis luar", "menambah kecepatan setiap pukulan tanpa memperhatikan akurasi", "selalu memukul shuttlecock setinggi mungkin tanpa tujuan", "memilih sasaran aman lebih dulu sambil membangun peluang serang", "mengabaikan catatan kesalahan sendiri"], "Bulu tangkis"], ["Empat sesi latihan bulu tangkis menghasilkan total 120 reli. Rata-rata jumlah reli per sesi adalah ...", ["24 reli", "30 reli", "35 reli", "40 reli", "45 reli"], "Bulu tangkis"], ["Pemain bulu tangkis sering terlambat menjangkau drop shot depan setelah memukul clear dari belakang; ia tetap berdiri tegak dan tidak segera kembali ke posisi siap. Penyebab paling mungkin adalah ...", ["kok selalu bergerak lebih cepat daripada aturan pertandingan", "raket yang digunakan berwarna gelap", "garis net terlalu tebal", "pemain seharusnya tetap berdiri di belakang setelah memukul", "pemulihan posisi dan langkah awal setelah memukul terlalu lambat"], "Bulu tangkis"], ["Menghadapi lawan defensif yang kuat mengembalikan smash, pemain A mulai kelelahan. Pilihan strategi paling masuk akal adalah ...", ["melakukan smash sekuat mungkin pada setiap kok", "terus menyerang tanpa jeda meski kualitas gerak menurun", "memvariasikan clear, drop shot, dan serangan terpilih untuk membuka ruang", "mengarahkan semua kok ke posisi lawan yang siap", "membiarkan kok jatuh agar tenaga hemat"], "Bulu tangkis"], ["Menjelang kejuaraan bulu tangkis internasional, program A berisi lima hari latihan intensif berturut-turut tanpa evaluasi kelelahan. Program B berisi tiga sesi teknik, dua sesi fisik bertahap, pemantauan beban, dan pemulihan terencana. Untuk atlet remaja yang mulai mengeluh lelah, program yang lebih layak adalah ...", ["program A karena volume tinggi selalu meningkatkan ketepatan pukulan", "program A karena tidak perlu memantau gejala kelelahan", "kedua program sama aman meskipun pola pemulihannya berbeda", "program B hanya jika seluruh latihan teknik ditiadakan", "program B karena variasi beban dan pemulihan mendukung kualitas latihan"], "Bulu tangkis"], ["Dalam sprint, fase akselerasi terutama bertujuan ...", ["meningkatkan kecepatan secara bertahap setelah start", "memperlambat langkah sebelum garis finis", "menahan tubuh tetap tegak sejak langkah pertama", "memindahkan jalur lari", "mengurangi gerak lengan sepanjang lomba"], "Atletik"], ["Saat aba-aba 'siap' pada start jongkok, posisi pinggul terangkat dan kedua tangan menyangga tubuh. Tujuan posisi tersebut adalah ...", ["menunda reaksi kaki agar pelari lebih santai", "memindahkan seluruh berat badan ke tumit", "membuat tubuh bersandar ke belakang", "menyiapkan tubuh menghasilkan dorongan awal yang efektif", "menghindari kontak kaki dengan balok start"], "Atletik"], ["Data berikut merupakan simulasi final sprint tingkat nasional. Catatan sprint 100 meter: 0–20 m ditempuh 3,5 detik; 20–40 m 2,7; 40–60 m 2,3; 60–80 m 2,4; 80–100 m 2,7. Bagian yang paling jelas menunjukkan penurunan kecepatan dibanding segmen sebelumnya adalah ...", ["20–40 m karena waktunya lebih cepat daripada segmen pertama", "80–100 m karena waktu segmennya meningkat dari 2,4 menjadi 2,7 detik", "40–60 m karena waktunya paling singkat", "0–20 m karena bagian itu adalah start", "tidak ada penurunan pada semua segmen"], "Atletik"], ["Pelari menempuh 400 meter dalam 80 detik. Kecepatan rata-ratanya adalah ...", ["4 m/detik", "6 m/detik", "7 m/detik", "8 m/detik", "5 m/detik"], "Atletik"], ["Dalam lompat jauh, dua percobaan menggunakan awalan serupa. Pada percobaan A, kaki menolak kuat pada papan dan badan bergerak ke depan-atas; pada B, lutut kaki tolakan terlalu menekuk dan dorongan lemah. Dampak paling masuk akal adalah ...", ["percobaan B pasti lebih jauh karena lutut lebih menekuk", "kekuatan tolakan tidak berpengaruh terhadap hasil", "percobaan B cenderung menghasilkan jarak lebih pendek karena dorongan tolakan kurang efektif", "hanya warna papan tolakan menentukan jarak", "percobaan A tidak mungkin menghasilkan lompatan sah"], "Atletik"], ["Seorang atlet lompat jauh mencatat tiga lompatan sah: 4,28 m; 4,46 m; dan 4,39 m. Hasil terbaiknya adalah ...", ["4,46 m", "4,28 m", "4,39 m", "4,13 m", "4,31 m"], "Atletik"], ["Ilustrasi latihan interval persiapan atlet PON. Dua latihan interval memiliki total lari sama: pola A memberi jeda 30 detik dan peserta kesulitan mempertahankan teknik; pola B memberi jeda 90 detik dan teknik relatif stabil. Bagi pemula yang berfokus pada kualitas gerak, evaluasi terbaik adalah ...", ["memilih pola A karena kelelahan selalu berarti latihan lebih baik", "memilih pola A karena waktu jeda tak memengaruhi teknik", "meniadakan semua jeda dari kedua pola", "memilih pola B karena pemulihan lebih memadai untuk menjaga teknik", "mewajibkan peserta berhenti berlatih selamanya"], "Atletik"], ["Siswa baru kembali berlatih lompat jauh setelah pulih dan diizinkan beraktivitas ringan; fasilitas berupa lintasan dan bak pasir aman. Rancangan peningkatan latihan yang paling sesuai adalah ...", ["langsung melakukan lompatan maksimal berulang tanpa pemanasan", "memulai latihan teknik awalan dan tolakan berintensitas rendah lalu menaikkan beban secara bertahap sesuai respons tubuh", "memulai dengan menambah jarak awalan dua kali lipat setiap sesi", "mengutamakan kompetisi penuh pada hari pertama", "mengabaikan keluhan nyeri agar target cepat tercapai"], "Atletik"], ["Tabel berikut merupakan data simulasi split time sprint 100 meter pada konteks Asian Games 2026: 0–20 m = 3,4 s; 20–40 m = 2,4 s; 40–60 m = 2,2 s; 60–80 m = 2,3 s; 80–100 m = 2,7 s. Untuk segmen berjarak sama, perubahan paling besar menuju perlambatan terjadi pada ...", ["20–40 m karena waktunya turun dibanding 0–20 m", "40–60 m karena pelari mencapai waktu segmen terendah", "60–80 m karena ada penambahan waktu sebesar 0,1 detik", "80–100 m karena waktu bertambah 0,4 detik dibanding segmen sebelumnya", "0–20 m karena memuat fase reaksi start dan akselerasi"], "Atletik"], ["Dalam pencak silat, sikap pasang digunakan terutama untuk ...", ["menunjukkan akhir pertandingan", "mengganti peran wasit", "menghindari semua perpindahan kaki", "memaksa lawan keluar arena tanpa teknik", "menyiapkan keseimbangan dan kesiagaan melakukan serangan atau pembelaan"], "Pencak silat"], ["Dalam latihan pencak silat, lawan melancarkan pukulan lurus ke arah dada. Bentuk penghindaran yang tepat sambil menjaga keseimbangan ialah ...", ["menundukkan kepala tepat ke lintasan pukulan", "berdiri diam dengan tangan di belakang", "menggeser tubuh ke samping di luar garis serangan", "melompat ke depan menuju pukulan", "membelakangi lawan tanpa melihat arah serangan"], "Pencak silat"], ["Dalam latihan pasangan, siswa melangkah terlalu jauh ke depan ketika memukul, sehingga tumit belakang terangkat berlebihan dan tubuh condong. Analisis paling tepat adalah ...", ["perpindahan titik berat melewati bidang tumpu membuat keseimbangan berkurang", "semakin jauh langkah selalu semakin stabil", "posisi tumpuan tidak memengaruhi pukulan", "keseimbangan hanya ditentukan ukuran matras", "pukulan tidak membutuhkan koordinasi kaki"], "Pencak silat"], ["Ketika berlatih tangkisan berpasangan, seorang siswa mendapati rekannya belum siap memakai pelindung yang disepakati. Tindakan paling tepat ialah ...", ["memulai serangan dengan tenaga penuh", "mempercepat latihan agar segera selesai", "melakukan gerakan tanpa jarak aman", "menunda pasangan latihan sampai keduanya siap dan memahami aba-aba", "mengabaikan instruksi pengawasan guru"], "Pencak silat"], ["Ilustrasi pertandingan pencak silat tingkat nasional. Dalam pertandingan pencak silat, pesilat A menghentikan serangan setelah aba-aba wasit, sedangkan pesilat B tetap menyerang saat lawan jatuh. Perbedaan utama keduanya adalah ...", ["B lebih sportif karena bertanding agresif kapan saja", "A menjaga sportivitas dan keselamatan, sedangkan B membahayakan lawan serta melanggar arahan wasit", "A tidak boleh mengikuti aba-aba wasit", "tindakan keduanya selalu dinilai sama", "keselamatan lawan tidak relevan dalam pertandingan"], "Pencak silat"], ["Ilustrasi pertandingan pencak silat SEA Games. Lawan pencak silat selalu melancarkan pukulan lurus lalu terlambat menarik tangannya. Saat latihan terkendali, celah serangan balik yang paling aman biasanya muncul ...", ["sebelum lawan mengawali gerak apa pun tanpa menjaga diri", "ketika pelatih sedang tidak mengawasi", "saat keduanya keluar dari area latihan", "tepat ketika tubuh sendiri kehilangan keseimbangan", "setelah berhasil menghindari pukulan ketika lawan sesaat kehilangan posisi siap"], "Pencak silat"], ["Latihan pencak silat terdiri atas 4 set dengan masing-masing 12 tendangan dan 8 pukulan. Total pengulangan seluruh teknik adalah ...", ["64 gerakan", "72 gerakan", "80 gerakan", "88 gerakan", "96 gerakan"], "Pencak silat"], ["Program A untuk pemula berisi latihan teknik dasar dengan pasangan terkendali, pemanasan, dan evaluasi gerak; program B berisi sparing intensitas tinggi tanpa penguasaan teknik. Program yang lebih tepat adalah ...", ["program A karena memprioritaskan keterampilan dasar dan keselamatan", "program B karena risiko cedera membuktikan efektivitas", "program B karena teknik dasar tidak diperlukan", "keduanya sama karena peserta masih s menjadi lebih licin karena tangan terlambat"], "Senam lantai"], ["Matras senam terlipat di bagian tengah dan ada kursi dekat area pendaratan. Keputusan paling tepat sebelum siswa mencoba rangkaian gerak adalah ...", ["meratakan matras dan memindahkan penghalang sebelum latihan dimulai", "membiarkan kursi karena di luar garis matras", "mencoba gerakan lebih cepat agar tidak mengenai kursi", "menghilangkan bantuan pengawas agar gerakan lancar", "menunda pemeriksaan keselamatan sampai siswa selesai"], "Senam lantai"], ["Rangkaian senam terdiri atas guling depan, berdiri seimbang, lalu guling belakang. Siswa langsung menjatuhkan badan setelah guling depan tanpa menstabilkan berdiri. Penyebab utama gangguan rangkaian adalah ...", ["jumlah gerak terlalu sedikit untuk dinilai", "guling belakang tidak pernah boleh digabung dengan gerakan lain", "berdiri seimbang selalu menurunkan nilai", "transisi tidak memberi kesempatan tubuh memperoleh keseimbangan sebelum gerak berikutnya", "matras tidak boleh dipakai untuk lebih dari satu gerak"], "Senam lantai"], ["Durasi mempertahankan sikap seimbang seorang siswa meningkat dari 4 detik, menjadi 6 detik, lalu 9 detik pada tiga latihan. Tindak lanjut yang paling sesuai adalah ...", ["langsung melakukan gerakan tingkat lanjut tanpa pendamping", "melanjutkan latihan dengan variasi sedikit lebih menantang dan tetap memberi pengawasan", "menghapus latihan keseimbangan karena hasil meningkat", "mengulangi hanya tes pertama tanpa latihan", "menyimpulkan kemampuan tidak berubah"], "Senam lantai"], ["Kelompok senam pemula menguasai guling depan, sikap lilin, dan keseimbangan berdiri, tetapi belum mampu melakukan salto. Rangkaian yang paling layak adalah ...", ["salto lalu guling depan tanpa pengawasan", "menggabungkan seluruh gerakan sulit yang belum dikuasai", "melakukan gerakan di lantai keras tanpa matras", "memulai dengan lompatan berisiko tinggi di dekat dinding", "guling depan lalu berdiri stabil, beralih ke sikap lilin, dan mengakhiri dengan keseimbangan berdiri di matras aman"], "Senam lantai"], ["Untuk meningkatkan daya tahan jantung-paru, bentuk aktivitas yang paling relevan ialah ...", ["mengangkat satu beban maksimal sekali", "duduk tanpa bergerak selama latihan", "lari atau bersepeda berkelanjutan sesuai kemampuan", "latihan satu gerakan peregangan statis saja", "menahan napas selama mungkin"], "Kebugaran jasmani"], ["Seorang siswa hendak meningkatkan daya tahan aerobik, tetapi selama sebulan hanya melakukan sprint maksimal lima detik sekali seminggu. Kekurangan utama program itu adalah ...", ["durasi dan keteraturan latihan belum sesuai untuk membangun daya tahan aerobik", "semua latihan sprint pasti meningkatkan daya tahan maksimal", "latihan sekali sebulan lebih baik daripada bertahap", "daya tahan tidak berkaitan dengan lama aktivitas", "latihan sebaiknya tanpa pemulihan"], "Kebugaran jasmani"], ["Profil siswa: baru mulai berolahraga dan mampu berjalan cepat 20 menit nyaman. Program A: jalan cepat 25 menit, 3 kali/minggu, peningkatan bertahap; program B: sprint maksimal 60 menit setiap hari. Penilaian yang paling tepat adalah ...", ["program B lebih baik karena intensitas selalu harus maksimal", "program B lebih aman karena dilakukan setiap hari", "kedua program sama persis bebannya", "program A lebih sesuai dengan prinsip FITT dan kemampuan awal siswa", "program A tidak dapat meningkatkan kebugaran"], "Kebugaran jasmani"], ["Denyut nadi istirahat seorang siswa 72 kali/menit dan setelah latihan 126 kali/menit. Perubahannya adalah ...", ["44 kali/menit", "54 kali/menit", "48 kali/menit", "62 kali/menit", "68 kali/menit"], "Kebugaran jasmani"], ["Data berikut merupakan simulasi pembinaan atlet remaja menuju PON. Waktu lari 1.200 meter dalam empat pengukuran: 9 menit 10 detik; 8 menit 52 detik; 8 menit 40 detik; 9 menit 05 detik. Interpretasi paling tepat ialah ...", ["waktu lari selalu turun pada setiap pengukuran", "pengukuran keempat merupakan hasil tercepat", "kinerja tidak mengalami   <button class="fin" id="fn2" style="width:100%;margin-top:14px">Selesai Ujian</button></div></div></main>`;
  tick();mj();
  document.querySelectorAll('.op').forEach(e=>e.onclick=()=>{S.ans[i]=+e.dataset.j;sv();exam()});
  document.querySelectorAll('.n').forEach(e=>e.onclick=()=>{S.cur=+e.dataset.i;sv();exam();window.scrollTo(0,0)});
  $('#pv').onclick=()=>{S.cur--;sv();exam();window.scrollTo(0,0)};
  $('#rg').onclick=()=>{S.flag[i]=!S.flag[i];sv();exam()};
  if($('#nx'))$('#nx').onclick=()=>{S.cur++;sv();exam();window.scrollTo(0,0)};
  if($('#fn'))$('#fn').onclick=confirmEnd;$('#fn2').onclick=confirmEnd;
}
function modal(html){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="card">${html}</div>`;document.body.appendChild(d);return d}
function confirmEnd(){
  grace=Date.now()+1500;
  const kos=S.ans.filter(a=>a<0).length,rg=S.flag.filter(Boolean).length;
  const d=modal(`<h2 style="margin-top:0">Akhiri ujian?</h2><p>Belum dijawab: <b>${kos}</b> soal<br>Ragu-ragu: <b>${rg}</b> soal<br>Sisa waktu: <b>${Math.floor(left()/60)}</b> menit</p><div class="nav"><button class="sc" id="no">Kembali</button><button class="fin" id="ya">Ya, selesai</button></div>`);
  $('#no').onclick=()=>d.remove();$('#ya').onclick=()=>{d.remove();finish('Dikumpulkan oleh peserta')};
}
/* ===== Anti curang ===== */
function viol(why){
  if(!active||ovl||Date.now()<grace||Date.now()-lastV<2000)return;
  lastV=Date.now();S.viol++;S.log.push(tm(Date.now())+' – '+why);sv();
  if(S.viol>=2){finish('Ujian dihentikan otomatis: pelanggaran kedua ('+why+')');return}
  ovl=modal(`<h2 style="margin-top:0;color:var(--no)">⚠️ Peringatan Kecurangan</h2><p>Terdeteksi: <b>${esc(why)}</b>.</p><p>Ini peringatan <b>satu-satunya</b>. Jika terjadi pelanggaran lagi, ujian akan <b>dihentikan otomatis</b> dan jawabanmu dikumpulkan.</p><button id="ok" style="width:100%">Saya mengerti, lanjutkan</button>`);
  $('#ok').onclick=()=>{ovl.remove();ovl=null;grace=Date.now()+2000;fs();exam()};
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)viol('Berpindah tab atau aplikasi')});
window.addEventListener('blur',()=>setTimeout(()=>{if(!document.hasFocus())viol('Jendela ujian kehilangan fokus (membuka jendela lain)')},400));
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)fsOn=true;else if(fsOn){fsOn=false;viol('Keluar dari mode layar penuh')}});
window.addEventListener('resize',()=>{if(active&&baseW&&window.innerWidth<baseW*0.7)viol('Ukuran jendela diperkecil (layar terbagi)')});
['contextmenu','copy','cut','paste','dragstart'].forEach(e=>document.addEventListener(e,ev=>{if(active)ev.preventDefault()}));
document.addEventListener('keydown',e=>{if(!active)return;const k=e.key.toLowerCase();if(e.key==='F12'||((e.ctrlKey||e.metaKey)&&['c','v','x','u','s','p','a'].includes(k))||((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c'].includes(k)))e.preventDefault()});
/* ===== Hasil ===== */
function finish(reason){
  if(!S||S.done)return;
  active=false;clearInterval(timer);if(ovl){ovl.remove();ovl=null}document.querySelectorAll('.ov').forEach(o=>o.remove());
  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  document.body.classList.remove('ex');
  const benar=S.ans.filter((a,i)=>a===L.indexOf(KEY[S.order[i]])).length,kos=S.ans.filter(a=>a<0).length;
  S.done={reason,benar,kos,salah:S.order.length-benar-kos,nilai:Math.round(benar/S.order.length*100),at:Date.now()};sv();result();
}
function result(f){
  f=f||'all';const d=S.done,N=S.order.length;
  const items=S.order.map((o,i)=>{const q=D[o],k=L.indexOf(KEY[o]),a=S.ans[i],s=a<0?'kos':a===k?'ok':'no';return{i,o,q,k,a,s}}).filter(x=>f==='all'||x.s===f);
  app.innerHTML=`<div class="hero"><h1>🏁 Hasil Ujian</h1></div><main>
  <div class="card" style="text-align:center"><div class="mu">Nilai Akhir</div><div class="big">${d.nilai}</div>
  <div class="id"><span>Nama</span><b>${esc(S.me.nama)}</b><span>Kelas</span><b>${esc(S.me.kelas)}</b><span>No. Peserta Didik</span><b>${esc(S.me.no)}</b><span>Asal Sekolah</span><b>${esc(S.me.sekolah)}</b><span>Mata Pelajaran</span><b>PJOK Kelas X (UAS Ganjil)</b></div>
  <div class="st"><div><b style="color:var(--ok)">${d.benar}</b>Benar</div><div><b style="color:var(--no)">${d.salah}</b>Salah</div><div><b style="color:var(--rg)">${d.kos}</b>Kosong</div><div><b>${N}</b>Jumlah soal</div></div>
  <p class="mu">Nilai = jumlah benar ÷ jumlah soal × 100 · ${esc(d.reason)}</p>
  ${S.log.length?`<div class="ex" style="text-align:left"><b>Catatan pelanggaran (${S.log.length}):</b><br>${S.log.map(esc).join('<br>')}</div>`:'<p class="mu">Tidak ada pelanggaran tercatat.</p>'}
  <button class="sc" onclick="window.print()">Cetak / Simpan PDF</button></div>
  <div class="card"><h2 style="margin-top:0">Jawaban dan Pembahasan</h2>
  <div class="tabs">${[['all','Semua'],['no','Salah'],['kos','Kosong'],['ok','Benar']].map(([k,t])=>`<button class="${f===k?'':'sc'}" data-f="${k}">${t}</button>`).join('')}</div>
  ${items.map(x=>`<div class="pb ${x.s}"><span class="mp">Soal ${x.i+1}</span> <span class="mu">${x.q[2]}</span>
  <div class="qt">${x.q[0]}</div>
  <div><span class="tag">${x.s==='ok'?'Benar':x.s==='no'?'Salah':'Tidak dijawab'}</span> · Jawabanmu: <b>${x.a<0?'–':L[x.a]+'.'}</b> ${x.a<0?'':x.q[1][x.a]}</div>
  <div>Kunci: <b>${L[x.k]}.</b> ${x.q[1][x.k]}</div>
  <div class="ex">💡 ${PB[x.o]}</div></div>`).join('')||'<p class="mu">Tidak ada soal pada kategori ini.</p>'}</div></main>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{result(b.dataset.f);window.scrollTo(0,0)});
  mj();
}
/* ===== Muat awal ===== */
(function init(){
  const s=ld();
  if(s&&s.done){S=s;result();return}
  if(s&&s.order){
    S=s;
    if(left()<=0){finish('Waktu habis');return}
    S.viol++;S.log.push(tm(Date.now())+' – Halaman dimuat ulang atau ditutup');sv();
    if(S.viol>=2){finish('Ujian dihentikan otomatis: pelanggaran kedua (halaman dimuat ulang)');return}
    app.innerHTML=`<div class="hero"><h1>⚠️ Peringatan Kecurangan</h1></div><main><div class="card"><p>Terdeteksi: <b>halaman dimuat ulang atau ditutup</b>. Ini peringatan <b>satu-satunya</b>. Pelanggaran berikutnya akan menghentikan ujian secara otomatis.</p><p>Sisa waktu: <b>${Math.floor(left()/60)}</b> menit. Jawabanmu sebelumnya tetap tersimpan.</p><button id="ct" style="width:100%">Lanjutkan Ujian</button></div></main>`;
    $('#ct').onclick=begin;return;
  }
  start();
})();
</script>
</body>
</html>
